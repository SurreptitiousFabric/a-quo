[package]
name = "a-quo-cli"
description = "Command-line interface for A Quo"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "a-quo"
path = "src/main.rs"

[dependencies]
a-quo-core = { path = "../a-quo-core" }
a-quo-domain = { path = "../a-quo-domain" }
a-quo-ipc = { path = "../a-quo-ipc" }
a-quo-omarchy = { path = "../a-quo-omarchy" }
a-quo-store = { path = "../a-quo-store" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true
tempfile.workspace = true

[dev-dependencies]
a-quo-daemon = { path = "../a-quo-daemon" }
tempfile.workspace = true
