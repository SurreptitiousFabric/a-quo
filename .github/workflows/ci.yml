name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up pinned Mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          install: true

      - name: Materialize pinned Rust components serially
        run: |
          mise exec -- cargo --version
          mise exec -- rustup component add rustfmt clippy

      - name: Confirm SSHSIG support
        run: command -v ssh-keygen

      - name: Run required checks
        run: mise run check

      - name: Audit locked dependencies
        run: mise run audit
