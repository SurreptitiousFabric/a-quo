name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-root-distribution:
    name: portable root distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up pinned Mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          install: true

      - name: Test portable root-card formats and renderers
        run: |
          mise exec -- cargo test -p a-quo-core root_distribution --lib
          mise exec -- cargo test -p a-quo-root-card

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Wayland build dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwayland-dev zstd

      - name: Set up pinned Mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          install: true

      - name: Materialize pinned Rust components serially
        run: |
          mise exec -- cargo --version
          mise exec -- rustup component add rustfmt clippy

      - name: Confirm SSHSIG support
        run: command -v ssh-keygen

      - name: Run required checks
        env:
          A_QUO_REQUIRE_CONSENT_SOCKET_TESTS: "1"
        run: mise run check

      - name: Audit locked dependencies
        run: mise run audit

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up project Mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          install: true

      - name: Install pinned fuzz tools through Mise
        run: mise install rust@nightly-2026-08-13 cargo:cargo-fuzz@0.13.2

      - name: Audit the fuzz dependency lock
        run: mise run fuzz-audit

      - name: Run bounded coverage-guided campaigns
        run: |
          mise run fuzz-smoke
          git diff --exit-code -- fuzz/Cargo.lock

      - name: Upload fuzz logs and failure artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            fuzz/logs/
            fuzz/artifacts/
            fuzz/runs/
          if-no-files-found: warn
          retention-days: 14
