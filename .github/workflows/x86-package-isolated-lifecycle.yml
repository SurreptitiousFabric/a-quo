            target/arch-package-skeleton/physical-x86_64-official-omarchy-4.0.2/
            target/arch-package-isolated-lifecycle/physical-x86_64-official-omarchy-4.0.2/
            ${{ runner.temp }}/a-quo-arch-package-isolated-lifecycle/physical-x86_64-official-omarchy-4.0.2/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: true

      - name: Remove the ephemeral isolated-lifecycle container and image
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          container_name="a-quo-x86-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker container inspect "${container_name}" >/dev/null 2>&1; then
            docker container rm --force -- "${container_name}"
          fi
          if [[ "${A_QUO_PREPARED_IMAGE_ID:-}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            docker image rm --force -- "${A_QUO_PREPARED_IMAGE_ID}"
          fi
          if [[ -n "${RUNNER_TEMP:-}" ]]; then
            runner_temp="$(realpath -e -- "${RUNNER_TEMP}")"
            [[ "${runner_temp}" == /* && "${runner_temp}" != / &&
              ! -L "${runner_temp}" ]]
            download_root="${runner_temp}/a-quo-x86-stage4-f1-download-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            case "${download_root}" in
              "${runner_temp}"/a-quo-x86-stage4-f1-download-*) ;;
              *) exit 1 ;;
            esac
            if [[ -e "${download_root}" || -L "${download_root}" ]]; then
              [[ -n "${A_QUO_F1_DOWNLOAD_IDENTITY:-}" &&
                -d "${download_root}" && ! -L "${download_root}" &&
                "${download_root}" == "$(realpath -e -- "${download_root}")" &&
                "$(stat -c '%d:%i:%u' -- "${download_root}")" == \
                  "${A_QUO_F1_DOWNLOAD_IDENTITY}" &&
                "$(stat -c '%u:%g:%a:%F' -- "${download_root}")" == \
                  '1001:1001:700:directory' ]]
              rm -rf -- "${download_root}"
            fi
            f1_root="${runner_temp}/a-quo-x86-stage4-f1-root-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            case "${f1_root}" in
              "${runner_temp}"/a-quo-x86-stage4-f1-root-*) ;;
              *) exit 1 ;;
            esac
            if [[ -e "${f1_root}" || -L "${f1_root}" ]]; then
              [[ -n "${A_QUO_F1_ROOT_IDENTITY:-}" &&
                -d "${f1_root}" && ! -L "${f1_root}" &&
                "${f1_root}" == "$(realpath -e -- "${f1_root}")" &&
                "$(stat -c '%d:%i:%u' -- "${f1_root}")" == \
                  "${A_QUO_F1_ROOT_IDENTITY}" &&
                "$(stat -c '%u:%g:%a:%F' -- "${f1_root}")" == \
                  '0:0:555:directory' ]]
              sudo rm -rf -- "${f1_root}"
            fi
          fi
