name: x86_64 static package acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x86-package-static-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-static-package:
    name: reviewed x86_64 static package
    if: ${{ github.repository == 'SurreptitiousFabric/a-quo' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      A_QUO_ARCH_BASE_IMAGE: archlinux:base-devel@sha256:a26046b7363dad8e2614858f4313949ae9b05c9c5f31de343a54864b9e20806f
      A_QUO_ARCH_BASE_REPO_DIGEST: archlinux@sha256:a26046b7363dad8e2614858f4313949ae9b05c9c5f31de343a54864b9e20806f
      A_QUO_DOCKERFILE_SHA256: 188c7b97faa3ee059806b4144e069fd348aaf641bd017311085985e2253735e6
      A_QUO_CONTAINER_POLICY_VERIFIER_SHA256: 7217616c6731eda0282dce73ec10a693989f8a0600625f32341b1a1987b60802
      A_QUO_OFFLINE_RUNNER_SHA256: ce336a43c3de3e4d2a769586b1fd78dee5415a478ba06af1c00d2dcdd064af03
      A_QUO_TARGET_RESOLVER_SHA256: e1cbb386db5f890ae61509a2ca33acd6180c459c4a9778c203f9cefbe9b88831
      A_QUO_PACKAGE_BUILDER_SHA256: 63c54347df158778bcafaa307acae49cec38e1eddf6727a1e5bf6316769d9fee
      A_QUO_PACKAGE_VERIFIER_SHA256: f0427319b1d6903261903c3756d1c2bf77b261be9a298b413fe317c41d495c92
      A_QUO_NEEDED_LOCK_SHA256: 216ec3cd2e0698fd42390ade8394e0077ea9a915382de87ae1fe5e864966c9b0
      A_QUO_NEEDED_LOCK_VERIFIER_SHA256: 6f0d8f2ae41f73e094b7d16182e99ef285012eabea4acb894a46cc2ad2491f73
      A_QUO_OBSERVER_UID: "1001"
      A_QUO_X86_EVIDENCE_NAMESPACE: physical-x86_64-official-omarchy-4.0.2
      A_QUO_X86_PROFILE_ID: a-quo-omarchy4-x86_64-macbookair7_2-official-4.0.2-v1
      A_QUO_X86_PROFILE_SHA256: 9e6295acb4e5dfa260227741566a58a45caf68f3a4e57ad4d7094f23eece0b6d
      A_QUO_NEEDED_EVIDENCE: reviewed-x86_64-needed-policy-sha256-216ec3cd2e0698fd42390ade8394e0077ea9a915382de87ae1fe5e864966c9b0
    steps:
      - name: Require the hosted x86_64 Docker boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RUNNER_ARCH:-}" == X64 ]]
          [[ "$(uname -m)" == x86_64 ]]
          [[ "$(id -u)" == "${A_QUO_OBSERVER_UID}" ]]
          [[ "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" == linux/amd64 ]]
          [[ -n "$(docker version --format '{{.Client.Version}}')" ]]
          [[ -n "$(docker version --format '{{.Server.Version}}')" ]]

      - name: Check out the exact complete revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the pinned ephemeral Arch static-verification image
        shell: bash
        run: |
          set -euo pipefail
          dockerfile="${GITHUB_WORKSPACE}/.github/workflows/x86-package-static-acceptance.Dockerfile"
          container_verifier="${GITHUB_WORKSPACE}/scripts/verify-x86-package-static-acceptance-container-policy.sh"
          offline_runner="${GITHUB_WORKSPACE}/scripts/run-x86-package-static-acceptance-offline.sh"
          target_resolver="${GITHUB_WORKSPACE}/scripts/resolve-arch-package-target.sh"
          package_builder="${GITHUB_WORKSPACE}/scripts/build-arch-package-skeleton.sh"
          package_verifier="${GITHUB_WORKSPACE}/scripts/verify-arch-package-skeleton.sh"
          needed_lock="${GITHUB_WORKSPACE}/packaging/evaluation-input-locks/a-quo-x86_64-needed-observation-cbbe29b6-v1.lock"
          needed_lock_verifier="${GITHUB_WORKSPACE}/scripts/verify-x86-package-needed-observation-lock.sh"
          while IFS='|' read -r path expected executable; do
            [[ -f "${path}" && ! -L "${path}" ]]
            [[ "$(sha256sum -- "${path}" | cut -d ' ' -f 1)" == "${expected}" ]]
            [[ "${executable}" == false || -x "${path}" ]]
          done <<EOF
          ${dockerfile}|${A_QUO_DOCKERFILE_SHA256}|false
          ${container_verifier}|${A_QUO_CONTAINER_POLICY_VERIFIER_SHA256}|true
          ${offline_runner}|${A_QUO_OFFLINE_RUNNER_SHA256}|true
          ${target_resolver}|${A_QUO_TARGET_RESOLVER_SHA256}|true
          ${package_builder}|${A_QUO_PACKAGE_BUILDER_SHA256}|true
          ${package_verifier}|${A_QUO_PACKAGE_VERIFIER_SHA256}|true
          ${needed_lock}|${A_QUO_NEEDED_LOCK_SHA256}|false
          ${needed_lock_verifier}|${A_QUO_NEEDED_LOCK_VERIFIER_SHA256}|true
          EOF
          "${needed_lock_verifier}" "${needed_lock}" >/dev/null
          docker pull --platform linux/amd64 "${A_QUO_ARCH_BASE_IMAGE}"
          docker image inspect "${A_QUO_ARCH_BASE_IMAGE}" | jq -e \
            --arg expected "${A_QUO_ARCH_BASE_REPO_DIGEST}" \
            'length == 1 and
             .[0].Os == "linux" and .[0].Architecture == "amd64" and
             (.[0].RepoDigests | index($expected)) != null'
          base_image_id="$(
            docker image inspect --format '{{.Id}}' "${A_QUO_ARCH_BASE_IMAGE}"
          )"
          [[ "${base_image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]
          prepared_tag="a-quo-x86-static:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --no-cache --pull=false --network=default \
            --tag "${prepared_tag}" - <"${dockerfile}"
          prepared_image_id="$(docker image inspect --format '{{.Id}}' "${prepared_tag}")"
          [[ "${prepared_image_id}" =~ ^sha256:[0-9a-f]{64}$ &&
            "${prepared_image_id}" != "${base_image_id}" ]]
          docker image inspect "${prepared_image_id}" | jq -e \
            'length == 1 and
             .[0].Os == "linux" and .[0].Architecture == "amd64" and
             .[0].Config.Labels["org.opencontainers.image.a-quo-acceptance"] ==
               "static-policy-reviewed"'
          {
            printf 'A_QUO_ARCH_BASE_IMAGE_ID=%s\n' "${base_image_id}"
            printf 'A_QUO_PREPARED_IMAGE_ID=%s\n' "${prepared_image_id}"
            printf 'A_QUO_PREPARED_IMAGE_TAG=%s\n' "${prepared_tag}"
          } >>"${GITHUB_ENV}"

      - name: Acquire the pinned Mise binary
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          sha256: cff4832ded79af2951e800bddcb5a22acac58630d765a2d062c1180680a0bb35
          install: false
          cache: false
          cache_save: false
          env: false
          export_path: true

      - name: Acquire pinned Rust and locked Cargo dependencies
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?GitHub runner temporary directory is required}"
          observer_home_host="${RUNNER_TEMP}/a-quo-x86-static-home-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tool_root="${RUNNER_TEMP}/a-quo-x86-static-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          workspace="$(realpath -e -- "${GITHUB_WORKSPACE}")"
          target="${workspace}/target"
          [[ -d "${workspace}" && ! -L "${workspace}" && "${workspace}" == "${GITHUB_WORKSPACE}" ]]
          install -d -m 0700 -- "${observer_home_host}" "${tool_root}" "${target}"
          install -d -m 0700 -- "${observer_home_host}/tmp"
          observer_home_host="$(realpath -e -- "${observer_home_host}")"
          tool_root="$(realpath -e -- "${tool_root}")"
          target="$(realpath -e -- "${target}")"
          acquisition_tmp_host="$(realpath -e -- "${observer_home_host}/tmp")"
          [[ "${acquisition_tmp_host}" == "${observer_home_host}/tmp" &&
            -d "${acquisition_tmp_host}" && ! -L "${acquisition_tmp_host}" ]]
          [[ "$(stat -c '%u:%a' -- "${acquisition_tmp_host}")" == 1001:700 ]]
          mise_path="$(command -v mise)"
          [[ "$(sha256sum -- "${mise_path}" | cut -d ' ' -f 1)" == \
            cff4832ded79af2951e800bddcb5a22acac58630d765a2d062c1180680a0bb35 ]]
          install -m 0555 -- "${mise_path}" "${tool_root}/mise"
          mise_host="$(realpath -e -- "${tool_root}/mise")"
          for path in "${workspace}" "${target}" "${observer_home_host}" "${mise_host}"; do
            [[ "${path}" == /* && "${path}" != *","* && ! -L "${path}" ]]
          done
          docker run --rm --pull=never --platform linux/amd64 \
            --network bridge --read-only --user 1001:1001 \
            --cap-drop ALL --security-opt no-new-privileges=true \
            --pids-limit 512 --tmpfs /tmp:rw,noexec,nosuid,nodev,mode=1777 \
            --mount "type=bind,src=${workspace},dst=/workspace,readonly" \
            --mount "type=bind,src=${target},dst=/workspace/target" \
            --mount "type=bind,src=${observer_home_host},dst=/home/a-quo-observer" \
            --mount "type=bind,src=${mise_host},dst=/usr/local/bin/mise,readonly" \
            --workdir /workspace \
            --env HOME=/home/a-quo-observer \
            --env MISE_CACHE_DIR=/home/a-quo-observer/.cache/mise \
            --env MISE_DATA_DIR=/home/a-quo-observer/.local/share/mise \
            --env MISE_TRUSTED_CONFIG_PATHS=/workspace \
            --env TMPDIR=/home/a-quo-observer/tmp \
            --entrypoint /usr/bin/bash \
            "${A_QUO_PREPARED_IMAGE_ID}" --noprofile --norc -euo pipefail -c \
            '/usr/local/bin/mise install rust@1.98.0 &&
             /usr/local/bin/mise exec -- cargo fetch --locked'
          {
            printf 'A_QUO_OBSERVER_HOME_HOST=%s\n' "${observer_home_host}"
            printf 'A_QUO_TARGET_HOST=%s\n' "${target}"
            printf 'A_QUO_MISE_HOST=%s\n' "${mise_host}"
            printf 'A_QUO_WORKSPACE_HOST=%s\n' "${workspace}"
          } >>"${GITHUB_ENV}"

      - name: Run the non-root offline static verifier
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?GitHub runner temporary directory is required}"
          source_commit="$(git -C "${GITHUB_WORKSPACE}" rev-parse --verify HEAD)"
          [[ "${source_commit}" == "${GITHUB_SHA}" && "${source_commit}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C "${GITHUB_WORKSPACE}" rev-parse --is-shallow-repository)" == false ]]
          [[ -z "$(git -C "${GITHUB_WORKSPACE}" status --porcelain=v1 --untracked-files=normal)" ]]
          for path in \
            "${A_QUO_WORKSPACE_HOST}" "${A_QUO_TARGET_HOST}" \
            "${A_QUO_OBSERVER_HOME_HOST}" "${A_QUO_MISE_HOST}"; do
            [[ "${path}" == "$(realpath -e -- "${path}")" &&
              "${path}" == /* && "${path}" != *","* && ! -L "${path}" ]]
          done
          [[ "${A_QUO_TARGET_HOST}" == "${A_QUO_WORKSPACE_HOST}/target" ]]
          container_name="a-quo-x86-static-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_id="$(
            docker create --name "${container_name}" --pull=never \
              --platform linux/amd64 --network none --read-only --user 1001:1001 \
              --cap-drop ALL --security-opt no-new-privileges=true \
              --pids-limit 512 --tmpfs /tmp:rw,noexec,nosuid,nodev,mode=1777 \
              --mount "type=bind,src=${A_QUO_WORKSPACE_HOST},dst=/workspace,readonly" \
              --mount "type=bind,src=${A_QUO_TARGET_HOST},dst=/workspace/target" \
              --mount "type=bind,src=${A_QUO_OBSERVER_HOME_HOST},dst=/home/a-quo-observer" \
              --mount "type=bind,src=${A_QUO_MISE_HOST},dst=/usr/local/bin/mise,readonly" \
              --workdir /workspace \
              --env HOME=/home/a-quo-observer \
              --env MISE_CACHE_DIR=/home/a-quo-observer/.cache/mise \
              --env MISE_DATA_DIR=/home/a-quo-observer/.local/share/mise \
              --env MISE_TRUSTED_CONFIG_PATHS=/workspace \
              --env MISE_OFFLINE=1 --env CARGO_NET_OFFLINE=true \
              --entrypoint /usr/bin/bash \
              "${A_QUO_PREPARED_IMAGE_ID}" --noprofile --norc \
              /workspace/scripts/run-x86-package-static-acceptance-offline.sh \
              "${source_commit}"
          )"
          [[ "${container_id}" =~ ^[0-9a-f]{64}$ ]]
          staging_prefix="${RUNNER_TEMP}/a-quo-x86-static-receipt."
          staging="$(mktemp -d "${staging_prefix}XXXXXX")"
          [[ -d "${staging}" && ! -L "${staging}" ]]
          staging_identity="$(stat -c '%d:%i:%u' -- "${staging}")"
          cleanup_staging() {
            local exit_status="$?" current_identity
            trap - EXIT
            case "${staging}" in "${staging_prefix}"??????) ;; *) exit 1 ;; esac
            [[ -d "${staging}" && ! -L "${staging}" ]] || exit 1
            current_identity="$(stat -c '%d:%i:%u' -- "${staging}")" || exit 1
            [[ "${current_identity}" == "${staging_identity}" ]] || exit 1
            rm -rf -- "${staging}"
            exit "${exit_status}"
          }
          trap cleanup_staging EXIT
          docker inspect "${container_id}" >"${staging}/OFFLINE-CONTAINER-INSPECT.json"
          "${GITHUB_WORKSPACE}/scripts/verify-x86-package-static-acceptance-container-policy.sh" \
            pre-start "${staging}/OFFLINE-CONTAINER-INSPECT.json" \
            "${container_id}" "${A_QUO_PREPARED_IMAGE_ID}" \
            "${A_QUO_WORKSPACE_HOST}" "${A_QUO_TARGET_HOST}" \
            "${A_QUO_OBSERVER_HOME_HOST}" "${A_QUO_MISE_HOST}" "${source_commit}"
          jq -S '.[0] | {Id, Image, Config, HostConfig: (.HostConfig | del(.OomKillDisable) | .Mounts |= sort_by(.Target)), Mounts: ([.Mounts[] | {Type, Source, Destination, RW}] | sort_by(.Destination))}' \
            "${staging}/OFFLINE-CONTAINER-INSPECT.json" \
            >"${staging}/OFFLINE-CONTAINER-CONFIG.json"
          inspect_sha256="$(sha256sum -- "${staging}/OFFLINE-CONTAINER-INSPECT.json" | cut -d ' ' -f 1)"
          config_sha256="$(sha256sum -- "${staging}/OFFLINE-CONTAINER-CONFIG.json" | cut -d ' ' -f 1)"
          package_query_sha256="$(docker run --rm --pull=never --platform linux/amd64 \
            --network none --read-only --user 1001:1001 --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges=true \
            --entrypoint /usr/bin/bash "${A_QUO_PREPARED_IMAGE_ID}" \
            --noprofile --norc -euo pipefail -c \
            'pacman -Q | LC_ALL=C sort | sha256sum | cut -d " " -f 1')"
          sync_database_sha256="$(docker run --rm --pull=never --platform linux/amd64 \
            --network none --read-only --user 1001:1001 --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges=true \
            --entrypoint /usr/bin/bash "${A_QUO_PREPARED_IMAGE_ID}" \
            --noprofile --norc -euo pipefail -c \
            'find /var/lib/pacman/sync -maxdepth 1 -type f -print0 |
             sort -z | xargs -0 sha256sum | sha256sum | cut -d " " -f 1')"
          for digest in "${inspect_sha256}" "${config_sha256}" \
            "${package_query_sha256}" "${sync_database_sha256}"; do
            [[ "${digest}" =~ ^[0-9a-f]{64}$ ]]
          done
          runner_temp="$(realpath -e -- "${RUNNER_TEMP}")"
          hosted_parent="${runner_temp}/a-quo-arch-package-static-acceptance/${A_QUO_X86_EVIDENCE_NAMESPACE}"
          pre_root="${hosted_parent}/${source_commit}.hosted-preflight"
          post_root="${hosted_parent}/${source_commit}.hosted-acceptance"
          for mounted_source in "${A_QUO_WORKSPACE_HOST}" "${A_QUO_TARGET_HOST}" \
            "${A_QUO_OBSERVER_HOME_HOST}" "${A_QUO_MISE_HOST}"; do
            case "${hosted_parent}/" in "${mounted_source}/"*) exit 1 ;; esac
            case "${mounted_source}/" in "${hosted_parent}/"*) exit 1 ;; esac
          done
          [[ ! -e "${pre_root}" && ! -L "${pre_root}" &&
            ! -e "${post_root}" && ! -L "${post_root}" ]]
          cat >"${staging}/HOSTED-PREFLIGHT.txt" <<EOF
          format=a-quo-x86_64-hosted-static-preflight-v1
          observation_authority=none
          expected_source_commit=${source_commit}
          profile_id=${A_QUO_X86_PROFILE_ID}
          profile_sha256=${A_QUO_X86_PROFILE_SHA256}
          architecture=x86_64
          evidence_namespace=${A_QUO_X86_EVIDENCE_NAMESPACE}
          runner_label_declared=ubuntu-24.04
          runner_arch_observed=${RUNNER_ARCH:-not-established}
          runner_image_os_observed=${ImageOS:-not-established}
          runner_image_version_observed=${ImageVersion:-not-established}
          docker_client_version_observed=$(docker version --format '{{.Client.Version}}')
          docker_server_version_observed=$(docker version --format '{{.Server.Version}}')
          docker_server_platform_observed=$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')
          docker_daemon_authority=host-root
          docker_rootless_claim=false
          base_container_image_expected=${A_QUO_ARCH_BASE_IMAGE}
          base_container_image_id_observed=${A_QUO_ARCH_BASE_IMAGE_ID}
          prepared_container_image_id=${A_QUO_PREPARED_IMAGE_ID}
          offline_container_id=${container_id}
          offline_container_inspect_sha256=${inspect_sha256}
          offline_container_config_sha256=${config_sha256}
          offline_container_process_uid=1001
          offline_container_process_gid=1001
          offline_container_network_mode=none
          offline_container_rootfs_read_only=true
          offline_container_repository_bind_read_only=true
          offline_container_target_bind_read_write=true
          offline_container_observer_home_bind_read_write=true
          offline_container_mise_bind_read_only=true
          hosted_receipt_mutable_by_offline_container=false
          arch_repository_snapshot=2026-08-24
          package_query_sha256=${package_query_sha256}
          pacman_sync_database_set_sha256=${sync_database_sha256}
          mise_version=2026.8.16
          mise_binary_sha256=cff4832ded79af2951e800bddcb5a22acac58630d765a2d062c1180680a0bb35
          rust_toolchain=1.98.0
          dependency_acquisition_network_used=true
          observation_execution_network_namespace=docker-network-none
          native_hardware_claim=not-established
          physical_target_evidence=false
          package_static_acceptance=false
          stage_4_completed=false
          stage_5_executed=false
          stage_6_authorized=false
          aarch64_gate_satisfied_by_x86_64=false
          publication_performed=false
          EOF
          chmod 0444 -- "${staging}/HOSTED-PREFLIGHT.txt" \
            "${staging}/OFFLINE-CONTAINER-INSPECT.json" \
            "${staging}/OFFLINE-CONTAINER-CONFIG.json"
          (
            cd -- "${staging}"
            sha256sum HOSTED-PREFLIGHT.txt OFFLINE-CONTAINER-INSPECT.json \
              OFFLINE-CONTAINER-CONFIG.json >PREFLIGHT-SHA256SUMS
            chmod 0444 PREFLIGHT-SHA256SUMS
            sha256sum --check --strict PREFLIGHT-SHA256SUMS
          )
          sudo install -d -o root -g root -m 0755 -- "${hosted_parent}" "${pre_root}"
          sudo install -o root -g root -m 0444 -- \
            "${staging}/HOSTED-PREFLIGHT.txt" \
            "${staging}/OFFLINE-CONTAINER-INSPECT.json" \
            "${staging}/OFFLINE-CONTAINER-CONFIG.json" \
            "${staging}/PREFLIGHT-SHA256SUMS" "${pre_root}/"
          sudo chmod 0555 -- "${pre_root}"
          [[ "$(stat -c '%u:%g:%a' -- "${pre_root}")" == 0:0:555 ]]
          while IFS= read -r preflight_entry; do
            [[ "$(stat -c '%u:%g:%a:%h:%F' -- \
              "${pre_root}/${preflight_entry}")" == \
              '0:0:444:1:regular file' ]]
          done < <(printf '%s\n' \
            HOSTED-PREFLIGHT.txt OFFLINE-CONTAINER-INSPECT.json \
            OFFLINE-CONTAINER-CONFIG.json PREFLIGHT-SHA256SUMS)
          docker start --attach "${container_id}"
          docker inspect "${container_id}" >"${staging}/OFFLINE-CONTAINER-INSPECT.after.json"
          "${GITHUB_WORKSPACE}/scripts/verify-x86-package-static-acceptance-container-policy.sh" \
            post-exit "${staging}/OFFLINE-CONTAINER-INSPECT.after.json" \
            "${container_id}" "${A_QUO_PREPARED_IMAGE_ID}" \
            "${A_QUO_WORKSPACE_HOST}" "${A_QUO_TARGET_HOST}" \
            "${A_QUO_OBSERVER_HOME_HOST}" "${A_QUO_MISE_HOST}" "${source_commit}"
          jq -S '.[0] | {Id, Image, Config, HostConfig: (.HostConfig | del(.OomKillDisable) | .Mounts |= sort_by(.Target)), Mounts: ([.Mounts[] | {Type, Source, Destination, RW}] | sort_by(.Destination))}' \
            "${staging}/OFFLINE-CONTAINER-INSPECT.after.json" \
            >"${staging}/OFFLINE-CONTAINER-CONFIG.after.json"
          cmp -- "${staging}/OFFLINE-CONTAINER-CONFIG.json" \
            "${staging}/OFFLINE-CONTAINER-CONFIG.after.json"
          (cd -- "${pre_root}"; sha256sum --check --strict PREFLIGHT-SHA256SUMS)
          acceptance_root="${A_QUO_TARGET_HOST}/arch-package-static-acceptance/${A_QUO_X86_EVIDENCE_NAMESPACE}/${source_commit}"
          package_root="${A_QUO_TARGET_HOST}/arch-package-skeleton/${A_QUO_X86_EVIDENCE_NAMESPACE}/${source_commit}"
          [[ "${acceptance_root}" == "$(realpath -e -- "${acceptance_root}")" &&
            "${package_root}" == "$(realpath -e -- "${package_root}")" &&
            ! -L "${acceptance_root}" && ! -L "${package_root}" ]]
          [[ "$(find "${acceptance_root}" -mindepth 1 -maxdepth 1 -type f \
            -printf '%f\n' | LC_ALL=C sort)" == "$(printf '%s\n' \
              SHA256SUMS STATIC-ACCEPTANCE.txt VERIFIER-RECEIPT.txt)" ]]
          (cd -- "${acceptance_root}"; sha256sum --check --strict SHA256SUMS)
          for required_acceptance in \
            "policy_commit=${source_commit}" \
            "profile_id=${A_QUO_X86_PROFILE_ID}" \
            "profile_sha256=${A_QUO_X86_PROFILE_SHA256}" \
            'architecture=x86_64' \
            "evidence_namespace=${A_QUO_X86_EVIDENCE_NAMESPACE}" \
            "needed_evidence=${A_QUO_NEEDED_EVIDENCE}" \
            'native_hardware_claim=not-established' \
            'physical_target_evidence=false' \
            'package_static_acceptance=true' \
            'stage_4_completed=true' \
            'stage_5_executed=false' \
            'stage_6_authorized=false' \
            'aarch64_gate_satisfied_by_x86_64=false'; do
            [[ "$(grep -Fxc -- "${required_acceptance}" \
              "${acceptance_root}/STATIC-ACCEPTANCE.txt")" -eq 1 ]]
          done
          package_filename="$(sed -n 's/^package_filename=//p' "${acceptance_root}/STATIC-ACCEPTANCE.txt")"
          package_sha256="$(sed -n 's/^package_sha256=//p' "${acceptance_root}/STATIC-ACCEPTANCE.txt")"
          [[ "${package_filename}" =~ ^a-quo-[0-9A-Za-z._+-]+-x86_64\.pkg\.tar\.zst$ &&
            "${package_sha256}" =~ ^[0-9a-f]{64}$ &&
            "$(sha256sum -- "${package_root}/${package_filename}" | cut -d ' ' -f 1)" == "${package_sha256}" ]]
          docker container rm -- "${container_id}"
          preflight_sha256="$(sha256sum -- "${pre_root}/PREFLIGHT-SHA256SUMS" | cut -d ' ' -f 1)"
          acceptance_manifest_sha256="$(sha256sum -- "${acceptance_root}/SHA256SUMS" | cut -d ' ' -f 1)"
          cat >"${staging}/HOSTED-ACCEPTANCE.txt" <<EOF
          format=a-quo-x86_64-hosted-static-acceptance-v1
          observation_authority=none
          policy_commit=${source_commit}
          profile_id=${A_QUO_X86_PROFILE_ID}
          profile_sha256=${A_QUO_X86_PROFILE_SHA256}
          architecture=x86_64
          evidence_namespace=${A_QUO_X86_EVIDENCE_NAMESPACE}
          needed_evidence=${A_QUO_NEEDED_EVIDENCE}
          hosted_preflight_manifest_sha256=${preflight_sha256}
          static_acceptance_manifest_sha256=${acceptance_manifest_sha256}
          package_filename=${package_filename}
          package_sha256=${package_sha256}
          offline_container_post_exit_policy_verified=true
          offline_container_configuration_stable=true
          offline_container_removed=true
          native_hardware_claim=not-established
          physical_target_evidence=false
          package_static_acceptance=true
          stage_4_completed=true
          stage_5_executed=false
          stage_6_authorized=false
          cross_profile_evidence_accepted=false
          aarch64_gate_satisfied_by_x86_64=false
          publication_performed=false
          EOF
          chmod 0444 -- "${staging}/HOSTED-ACCEPTANCE.txt"
          sha256sum -- "${staging}/HOSTED-ACCEPTANCE.txt" \
            >"${staging}/ACCEPTANCE-SHA256SUMS"
          chmod 0444 -- "${staging}/ACCEPTANCE-SHA256SUMS"
          sudo install -d -o root -g root -m 0755 -- "${post_root}"
          sudo install -o root -g root -m 0444 -- \
            "${staging}/HOSTED-ACCEPTANCE.txt" \
            "${staging}/ACCEPTANCE-SHA256SUMS" "${post_root}/"
          sudo chmod 0555 -- "${post_root}"
          [[ "$(stat -c '%u:%g:%a' -- "${post_root}")" == 0:0:555 ]]
          while IFS= read -r acceptance_entry; do
            [[ "$(stat -c '%u:%g:%a:%h:%F' -- \
              "${post_root}/${acceptance_entry}")" == \
              '0:0:444:1:regular file' ]]
          done < <(printf '%s\n' \
            HOSTED-ACCEPTANCE.txt ACCEPTANCE-SHA256SUMS)
          (cd -- "${post_root}"; sha256sum --check --strict ACCEPTANCE-SHA256SUMS)

      - name: Upload only the fixed accepted x86_64 stage-4 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: x86-static-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/arch-package-skeleton/physical-x86_64-official-omarchy-4.0.2/
            target/arch-package-static-acceptance/physical-x86_64-official-omarchy-4.0.2/
            ${{ runner.temp }}/a-quo-arch-package-static-acceptance/physical-x86_64-official-omarchy-4.0.2/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: true

      - name: Remove the ephemeral static-verification container and image
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          container_name="a-quo-x86-static-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker container inspect "${container_name}" >/dev/null 2>&1; then
            docker container rm --force -- "${container_name}"
          fi
          if [[ "${A_QUO_PREPARED_IMAGE_ID:-}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            docker image rm --force -- "${A_QUO_PREPARED_IMAGE_ID}"
          fi
