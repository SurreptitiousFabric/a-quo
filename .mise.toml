[tools]
rust = "1.98.0"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-cyclonedx" = "0.5.9"
shellcheck = "0.11.0"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Run Clippy with warnings denied"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run the complete test suite"
run = "cargo test --workspace --all-features"

[tasks.fuzz-lock]
description = "Verify the independent fuzz workspace lockfile is current"
run = "cargo tree --manifest-path fuzz/Cargo.toml --locked --depth 0 >/dev/null"

[tasks.workspace-dependencies]
description = "Materialize locked workspace dependencies before deliberately offline build checks"
run = "cargo fetch --locked"

[tasks.check]
description = "Run every required local and CI check"
depends = ["fmt", "lint", "test", "fuzz-lock", "release-scaffold-lint", "omarchy-corpus-builder-test", "omarchy-bootstrap-acquisition-contract", "omarchy-ubuntu-oci-acquisition-contract", "omarchy-ubuntu-oci-input-lock-contract", "omarchy-builder-context-input-lock-contract"]

[tasks.audit]
description = "Check Cargo.lock against the RustSec advisory database"
run = "cargo audit --deny warnings"

[tasks.release-scaffold-lint]
description = "Validate non-publishing release and package-skeleton scripts"
depends = ["arch-package-upgrade-contract", "installed-a-quo-package-lifecycle-contract"]
run = "bash -n scripts/build-release-scaffold.sh packaging/install-runtime-payload.sh scripts/build-arch-package-skeleton.sh scripts/test-arch-package-assets.sh scripts/test-arch-package-lifecycle-smoke.sh scripts/test-arch-package-version.sh scripts/test-installed-omarchy-core-lifecycle.sh scripts/test-installed-omarchy-core-lifecycle-contract.sh scripts/test-installed-omarchy-core-preconsented-contract.sh scripts/test-installed-a-quo-consent-lifecycle.sh scripts/test-installed-a-quo-consent-lifecycle-contract.sh scripts/test-installed-a-quo-consent-handoff-contract.sh scripts/verify-arch-package-skeleton.sh scripts/verify-omarchy-evaluation-target-profile.sh scripts/test-omarchy-evaluation-target-profile-contract.sh && shellcheck scripts/build-release-scaffold.sh packaging/install-runtime-payload.sh scripts/build-arch-package-skeleton.sh scripts/test-arch-package-assets.sh scripts/test-arch-package-lifecycle-smoke.sh scripts/test-arch-package-version.sh scripts/test-installed-omarchy-core-lifecycle.sh scripts/test-installed-omarchy-core-lifecycle-contract.sh scripts/test-installed-omarchy-core-preconsented-contract.sh scripts/test-installed-a-quo-consent-lifecycle.sh scripts/test-installed-a-quo-consent-lifecycle-contract.sh scripts/test-installed-a-quo-consent-handoff-contract.sh scripts/verify-arch-package-skeleton.sh scripts/verify-omarchy-evaluation-target-profile.sh scripts/test-omarchy-evaluation-target-profile-contract.sh && scripts/test-arch-package-assets.sh && scripts/test-arch-package-version.sh && scripts/test-installed-omarchy-core-lifecycle-contract.sh && scripts/test-installed-omarchy-core-preconsented-contract.sh && scripts/test-installed-a-quo-consent-lifecycle-contract.sh && scripts/test-installed-a-quo-consent-handoff-contract.sh && scripts/test-omarchy-evaluation-target-profile-contract.sh"

[tasks.omarchy-evaluation-target-profile-contract]
description = "Validate the frozen-but-unarmed Omarchy target profile without network, package, or VM activity"
run = "bash -n scripts/verify-omarchy-evaluation-target-profile.sh scripts/test-omarchy-evaluation-target-profile-contract.sh && shellcheck scripts/verify-omarchy-evaluation-target-profile.sh scripts/test-omarchy-evaluation-target-profile-contract.sh && bash scripts/test-omarchy-evaluation-target-profile-contract.sh"

[tasks.omarchy-bootstrap-acquisition-contract]
description = "Exercise the candidate-only Omarchy bootstrap boundary with synthetic signed inputs and no network"
run = "bash -n scripts/acquire-omarchy-bootstrap-candidates.sh scripts/verify-omarchy-bootstrap-candidate.sh scripts/test-omarchy-bootstrap-acquisition-contract.sh && shellcheck scripts/acquire-omarchy-bootstrap-candidates.sh scripts/verify-omarchy-bootstrap-candidate.sh scripts/test-omarchy-bootstrap-acquisition-contract.sh && bash scripts/test-omarchy-bootstrap-acquisition-contract.sh"

[tasks.omarchy-bootstrap-candidate-verify]
description = "Verify one retained Omarchy bootstrap candidate offline without granting authority"
run = "bash scripts/verify-omarchy-bootstrap-candidate.sh"

[tasks.omarchy-bootstrap-acquire]
description = "Explicitly networked acquisition of one non-authoritative Omarchy bootstrap candidate"
depends = ["omarchy-bootstrap-acquisition-contract"]
run = "bash scripts/acquire-omarchy-bootstrap-candidates.sh"

[tasks.omarchy-ubuntu-oci-acquisition-contract]
description = "Exercise the candidate-only Ubuntu OCI boundary with synthetic exact bytes and no network"
run = "bash -n scripts/acquire-omarchy-ubuntu-oci-candidate.sh scripts/verify-omarchy-ubuntu-oci-candidate.sh scripts/test-omarchy-ubuntu-oci-candidate-contract.sh && shellcheck -x scripts/acquire-omarchy-ubuntu-oci-candidate.sh scripts/verify-omarchy-ubuntu-oci-candidate.sh scripts/test-omarchy-ubuntu-oci-candidate-contract.sh && bash scripts/test-omarchy-ubuntu-oci-candidate-contract.sh"

[tasks.omarchy-ubuntu-oci-candidate-verify]
description = "Verify one retained Ubuntu OCI candidate offline without granting authority"
run = "bash scripts/verify-omarchy-ubuntu-oci-candidate.sh"

[tasks.omarchy-ubuntu-oci-acquire]
description = "Explicitly networked acquisition of one non-authoritative Ubuntu OCI candidate"
depends = ["omarchy-ubuntu-oci-acquisition-contract"]
run = "bash scripts/acquire-omarchy-ubuntu-oci-candidate.sh"

[tasks.omarchy-ubuntu-oci-input-lock-contract]
description = "Materialize locked dependencies, then exercise the OCI input-lock boundary with Cargo forced offline"
depends = ["workspace-dependencies"]
run = "cargo test --offline --locked --package a-quo-omarchy-input-lock && cargo clippy --offline --locked --package a-quo-omarchy-input-lock --all-targets -- -D warnings"

[tasks.omarchy-ubuntu-oci-input-lock-inspect]
description = "Inspect an externally pinned OCI input lock and profile without claiming object bytes are present"
depends = ["omarchy-ubuntu-oci-input-lock-contract"]
run = "cargo run --offline --quiet --locked --package a-quo-omarchy-input-lock -- inspect"

[tasks.omarchy-ubuntu-oci-input-lock-verify]
description = "Verify four caller-supplied OCI objects offline from sealed snapshots without building an image"
depends = ["omarchy-ubuntu-oci-input-lock-contract"]
run = "cargo run --offline --quiet --locked --package a-quo-omarchy-input-lock -- verify"

[tasks.omarchy-builder-context-input-lock-contract]
description = "Materialize locked dependencies, then exercise the inert builder-context input-lock boundary with Cargo forced offline"
depends = ["workspace-dependencies"]
run = "cargo test --offline --locked --package a-quo-omarchy-builder-context-lock && cargo clippy --offline --locked --package a-quo-omarchy-builder-context-lock --all-targets -- -D warnings"

[tasks.omarchy-builder-context-input-lock-inspect]
description = "Inspect an externally pinned builder-context lock and profile without claiming source bytes are present"
depends = ["omarchy-builder-context-input-lock-contract"]
run = "cargo run --offline --quiet --locked --package a-quo-omarchy-builder-context-lock -- inspect"

[tasks.omarchy-builder-context-input-lock-verify]
description = "Verify ten caller-supplied inert source files from sealed snapshots without Git or harness execution"
depends = ["omarchy-builder-context-input-lock-contract"]
run = "cargo run --offline --quiet --locked --package a-quo-omarchy-builder-context-lock -- verify"

[tasks.installed-omarchy-core-lifecycle-contract]
description = "Check the disposable installed-Omarchy evaluator without mutating system or user state"
run = "bash -n scripts/test-installed-omarchy-core-lifecycle.sh scripts/test-installed-omarchy-core-lifecycle-contract.sh scripts/test-installed-omarchy-core-preconsented-contract.sh && shellcheck scripts/test-installed-omarchy-core-lifecycle.sh scripts/test-installed-omarchy-core-lifecycle-contract.sh scripts/test-installed-omarchy-core-preconsented-contract.sh && bash scripts/test-installed-omarchy-core-lifecycle-contract.sh && bash scripts/test-installed-omarchy-core-preconsented-contract.sh"

[tasks.installed-omarchy-core-lifecycle]
description = "Run the explicitly armed core lifecycle on a marked disposable Omarchy evaluator"
depends = ["installed-omarchy-core-lifecycle-contract"]
run = "bash scripts/test-installed-omarchy-core-lifecycle.sh"

[tasks.installed-a-quo-package-lifecycle-contract]
description = "Check the guarded real-pacman package lifecycle bridge without mutating package or user state"
run = "bash -n scripts/test-installed-a-quo-package-lifecycle.sh scripts/test-installed-a-quo-package-lifecycle-contract.sh && shellcheck scripts/test-installed-a-quo-package-lifecycle.sh scripts/test-installed-a-quo-package-lifecycle-contract.sh && bash scripts/test-installed-a-quo-package-lifecycle-contract.sh"

[tasks.installed-a-quo-package-lifecycle]
description = "DESTRUCTIVE: run real pacman install/upgrade, installed signing consent, joined v1 core evaluation, removal, and reinstall on a marked disposable Omarchy target"
depends = ["installed-a-quo-package-lifecycle-contract"]
run = "bash scripts/test-installed-a-quo-package-lifecycle.sh"

[tasks.installed-a-quo-consent-lifecycle-contract]
description = "Check the interactive installed service/consent evaluator without mutating system or user state"
run = "bash -n scripts/test-installed-a-quo-consent-lifecycle.sh scripts/test-installed-a-quo-consent-lifecycle-contract.sh scripts/test-installed-a-quo-consent-handoff-contract.sh && shellcheck scripts/test-installed-a-quo-consent-lifecycle.sh scripts/test-installed-a-quo-consent-lifecycle-contract.sh scripts/test-installed-a-quo-consent-handoff-contract.sh && bash scripts/test-installed-a-quo-consent-lifecycle-contract.sh && bash scripts/test-installed-a-quo-consent-handoff-contract.sh"

[tasks.installed-a-quo-consent-lifecycle]
description = "Run operator-observed decline/approval through the packaged service on a marked disposable Omarchy evaluator"
depends = ["installed-a-quo-consent-lifecycle-contract"]
run = "bash scripts/test-installed-a-quo-consent-lifecycle.sh"

[tasks.release-scaffold]
description = "Build local binaries, CycloneDX SBOMs, metadata, and checksums without publishing"
depends = ["release-scaffold-lint"]
run = "bash scripts/build-release-scaffold.sh"

[tasks.arch-package-skeleton]
description = "Build and verify a passive non-publishable Arch package on clean native aarch64"
depends = ["release-scaffold-lint"]
run = "bash scripts/build-arch-package-skeleton.sh"

[tasks.arch-package-lifecycle-smoke]
description = "Simulate install/remove of an exact package under isolated fakeroot/libalpm state"
run = "bash scripts/test-arch-package-lifecycle-smoke.sh"

[tasks.arch-package-upgrade-contract]
description = "Check the isolated two-version package-transition harness without mutating host package state"
run = "bash -n scripts/test-arch-package-upgrade-smoke.sh scripts/test-arch-package-upgrade-contract.sh && shellcheck scripts/test-arch-package-upgrade-smoke.sh scripts/test-arch-package-upgrade-contract.sh && bash scripts/test-arch-package-upgrade-contract.sh"

[tasks.arch-package-upgrade-smoke]
description = "Simulate an exact older-to-newer package transition, removal, and reinstall under isolated fakeroot/libalpm state"
depends = ["arch-package-upgrade-contract"]
run = "bash scripts/test-arch-package-upgrade-smoke.sh"

[tasks.omarchy-corpus-builder-test]
description = "Test the deterministic corpus builder against a synthetic offline bare repository"
depends = ["workspace-dependencies"]
run = "bash -n scripts/build-omarchy-corpus.sh scripts/test-omarchy-corpus-builder.sh && shellcheck scripts/build-omarchy-corpus.sh scripts/test-omarchy-corpus-builder.sh && bash scripts/test-omarchy-corpus-builder.sh"

[tasks.omarchy-corpus]
description = "Build all six unsigned fixtures offline from local bare source repositories"
run = "bash scripts/build-omarchy-corpus.sh"

[tasks.omarchy-corpus-lifecycle]
description = "Run the opt-in locally self-signed real-Frame lifecycle against an unpublished local cohort"
run = '''
if [ "$(uname -s)" != "Linux" ]; then
  printf '%s\n' 'the real-Frame lifecycle harness requires Linux' >&2
  exit 1
fi
cargo test --locked --package a-quo-omarchy --lib corpus_tests::signed_frame_0_5_0_to_0_5_1_lifecycle -- --exact --ignored --nocapture
'''

[tasks.fuzz-build]
description = "Build every coverage-guided parser fuzz target"
depends = ["fuzz-lock"]
tools = { rust = "nightly-2026-08-13", "cargo:cargo-fuzz" = "0.13.2" }
run = "cargo fuzz build --fuzz-dir fuzz"

[tasks.fuzz-smoke]
description = "Run reproducible fixed-seed parser campaigns with ASan and LSan"
depends = ["fuzz-build"]
tools = { rust = "nightly-2026-08-13", "cargo:cargo-fuzz" = "0.13.2" }
run = "bash fuzz/scripts/run-smoke.sh"

[tasks.fuzz-smoke-no-lsan]
description = "Run the same reproducible campaign where ptrace prevents LeakSanitizer"
depends = ["fuzz-build"]
tools = { rust = "nightly-2026-08-13", "cargo:cargo-fuzz" = "0.13.2" }
run = "bash fuzz/scripts/run-smoke.sh --no-lsan"

[tasks.fuzz-learn-continuity]
description = "Grow the persistent ignored continuity/recovery corpus until interrupted"
depends = ["fuzz-build"]
tools = { rust = "nightly-2026-08-13", "cargo:cargo-fuzz" = "0.13.2" }
run = '''
set -eu
mkdir -p fuzz/corpus/continuity_recovery_bytes
cargo fuzz run --fuzz-dir fuzz continuity_recovery_bytes fuzz/corpus/continuity_recovery_bytes fuzz/seeds/continuity_recovery_bytes -- -max_len=262144 -timeout=5 -rss_limit_mb=1024 -malloc_limit_mb=256 -dict=fuzz/dictionaries/continuity_recovery.dict
'''

[tasks.fuzz-learn-backup]
description = "Grow the persistent ignored persona-backup corpus until interrupted"
depends = ["fuzz-build"]
tools = { rust = "nightly-2026-08-13", "cargo:cargo-fuzz" = "0.13.2" }
run = '''
set -eu
mkdir -p fuzz/corpus/persona_backup_bytes
cargo fuzz run --fuzz-dir fuzz persona_backup_bytes fuzz/corpus/persona_backup_bytes fuzz/seeds/persona_backup_bytes -- -max_len=262144 -timeout=5 -rss_limit_mb=1024 -malloc_limit_mb=256 -dict=fuzz/dictionaries/persona_backup.dict
'''

[tasks.fuzz-learn-root-distribution]
description = "Grow the persistent ignored root-card/pin/URI corpus until interrupted"
depends = ["fuzz-build"]
tools = { rust = "nightly-2026-08-13", "cargo:cargo-fuzz" = "0.13.2" }
run = '''
set -eu
mkdir -p fuzz/corpus/root_distribution_bytes
cargo fuzz run --fuzz-dir fuzz root_distribution_bytes fuzz/corpus/root_distribution_bytes fuzz/seeds/root_distribution_bytes -- -max_len=16384 -timeout=5 -rss_limit_mb=1024 -malloc_limit_mb=256 -dict=fuzz/dictionaries/root_distribution.dict
'''

[tasks.fuzz-learn-omarchy-risk]
description = "Grow the persistent ignored Omarchy risk-record corpus until interrupted"
depends = ["fuzz-build"]
tools = { rust = "nightly-2026-08-13", "cargo:cargo-fuzz" = "0.13.2" }
run = '''
set -eu
mkdir -p fuzz/corpus/omarchy_risk_records_bytes
cargo fuzz run --fuzz-dir fuzz omarchy_risk_records_bytes fuzz/corpus/omarchy_risk_records_bytes fuzz/seeds/omarchy_risk_records_bytes -- -max_len=1048577 -timeout=5 -rss_limit_mb=1024 -malloc_limit_mb=256 -dict=fuzz/dictionaries/omarchy_risk.dict
'''

[tasks.fuzz-audit]
description = "Audit the independent fuzz-workspace lockfile"
depends = ["fuzz-lock"]
run = "cargo audit --file fuzz/Cargo.lock --deny warnings"
